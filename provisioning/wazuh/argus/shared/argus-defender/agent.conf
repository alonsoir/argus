<!--
  provisioning/wazuh/argus/shared/argus-defender/agent.conf — [VIGILANCIA-D321] ADR-060 8e.4d.
  Configuración centralizada del grupo argus-defender (sniffer, ml-detector y firewall-acl-agent). La reparte el
  manager (/var/ossec/etc/shared/argus-defender/agent.conf). Sin <command>: ver la nota de argus-control.
  /vagrant es vboxsf: sin inotify, así que lo que vive ahí va en el escaneo periódico, no en tiempo real.
-->
<agent_config>
  <syscheck>
    <directories realtime="yes" check_all="yes">/etc/ml-defender</directories>
    <directories realtime="yes" check_all="yes">/etc/argus-pki</directories>
    <directories realtime="yes" check_all="yes">/etc/falco</directories>
    <directories check_all="yes">/vagrant/firewall-acl-agent/config,/vagrant/sniffer/config,/vagrant/ml-detector/config</directories>
  </syscheck>

  <!-- Log del firewall-acl-agent: las líneas [PROTEGIDOS-*] (decoder argus-protegidos) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/vagrant/logs/lab/firewall-agent.log</location>
  </localfile>

  <!-- Evidencia de spoofing del kernel (LOG ARGUS-SPOOF-IF / ARGUS-SPOOF-MAC de 8e.4b) -->
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
    <filter field="MESSAGE">^ARGUS-SPOOF-(IF|MAC) </filter>
  </localfile>

  <!-- Eventos de Falco -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/eventos.json</location>
  </localfile>
</agent_config>
