<!--
  provisioning/wazuh/argus/shared/argus-control/agent.conf — [VIGILANCIA-D321] ADR-060 8e.4d (H-I).
  Configuración centralizada del grupo argus-control (las VMs del plano de control: etcd-server, etcd y Vault). La reparte el manager
  (/var/ossec/etc/shared/argus-control/agent.conf; scripts/vigilancia/wazuh_manager_desplegar.sh). Se suma al ossec.conf
  local del agente. Sin <command>/<full_command>: exigirían logcollector.remote_commands=1 en el agente, y un manager
  comprometido podría ejecutar órdenes en él; el disco lo mide argus-disco (servicio propio) y lo escribe al journal.
  Bloques journald: se combinan en OR y una línea que encaja en dos se envía una vez (documentación de Wazuh).
-->
<agent_config>
  <!-- FIM: lo que da identidad y confianza al plano de control. Tiempo real en la configuración y la PKI; los
       binarios, en el escaneo periódico (cambian solo con un despliegue, que también sale como alerta) -->
  <syscheck>
    <directories realtime="yes" check_all="yes">/etc/ml-defender/etcd-server</directories>
    <directories realtime="yes" check_all="yes">/etc/argus-pki</directories>
    <directories realtime="yes" check_all="yes">/etc/etcd</directories>
    <directories realtime="yes" check_all="yes">/etc/vault.d</directories>
    <directories realtime="yes" check_all="yes">/etc/argus-vigilancia</directories>
    <directories realtime="yes" check_all="yes">/etc/falco</directories>
    <directories check_all="yes">/opt/argus/etcd-server/bin</directories>
    <directories check_all="yes">/usr/local/bin,/usr/local/sbin</directories>
  </syscheck>

  <!-- Vault: solo sus líneas [ERROR] (el audit device de syslog, vault-audit, es una línea por petición y no sale) -->
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
    <filter field="SYSLOG_IDENTIFIER">^vault$</filter>
    <filter field="MESSAGE">\[ERROR\]</filter>
  </localfile>

  <!-- Discos del audit de Vault y de los datos de etcd (argus-disco: rutas y umbral en
       /etc/argus-vigilancia/disco.json; una línea por partición) [DISCO-RUTAS-D324] -->
  <localfile>
    <location>journald</location>
    <log_format>journald</log_format>
    <filter field="SYSLOG_IDENTIFIER">^argus-disco$</filter>
  </localfile>

  <!-- Eventos de Falco (provisioning/falco/argus_salida.yaml) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/eventos.json</location>
  </localfile>
</agent_config>
